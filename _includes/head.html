<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<meta name="description" content="{{ page.description | default: site.description }}">
<title>{{ page.seo_title | default: page.title }} · {{ site.author }}</title>
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Percorsi · {{ site.author }}">
<meta property="og:locale" content="it_IT">
<meta property="og:title" content="{{ page.og_title | default: page.seo_title | default: page.title }}">
<meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#FBF8F3">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author }}",
  "jobTitle": "Psicologo e Psicoterapeuta",
  "url": "{{ site.hub_url }}",
  "email": "mailto:{{ site.email }}",
  "sameAs": ["{{ site.opl_url }}", "{{ site.linkedin_url }}", "{{ site.hub_url }}"]
}
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
